name: Build DLL

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      CI_TARGET_FRAMEWORKS: net48;net8.0-windows;net10.0-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clean output directory
        shell: pwsh
        run: |
          if (Test-Path OutPut) {
            Remove-Item OutPut -Recurse -Force
          }
          New-Item -ItemType Directory -Path OutPut | Out-Null

      - name: Restore dependencies
        run: dotnet restore src/WPFDevelopers.Net45x/WPFDevelopers.Net45x.csproj /p:TargetFrameworks="${{ env.CI_TARGET_FRAMEWORKS }}"

      - name: Build multi-target library
        run: msbuild src/WPFDevelopers.Net45x/WPFDevelopers.Net45x.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:TargetFrameworks="${{ env.CI_TARGET_FRAMEWORKS }}" /p:SignAssembly=false /m

      - name: Upload DLL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wpfdevelopers-dlls
          path: OutPut/**/WPFDevelopers.dll
          if-no-files-found: error
