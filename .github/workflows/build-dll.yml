name: Build DLL

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      build_net40:
        description: Build net40 on a self-hosted Windows runner with .NET Framework 4.0 Developer Pack installed
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clean output directory
        shell: pwsh
        run: |
          if (Test-Path OutPut) {
            Remove-Item OutPut -Recurse -Force
          }
          New-Item -ItemType Directory -Path OutPut | Out-Null

      - name: Restore and build target frameworks
        shell: pwsh
        run: |
          $frameworks = @('net48', 'net8.0-windows', 'net10.0-windows')

          foreach ($framework in $frameworks) {
            dotnet restore src/WPFDevelopers.Net45x/WPFDevelopers.Net45x.csproj /p:TargetFramework=$framework
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            msbuild src/WPFDevelopers.Net45x/WPFDevelopers.Net45x.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:TargetFramework=$framework /p:SignAssembly=false /m
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Upload DLL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wpfdevelopers-dlls
          path: OutPut/**/WPFDevelopers.dll
          if-no-files-found: error

  build-net40-self-hosted:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_net40 }}
    runs-on:
      - self-hosted
      - windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clean output directory
        shell: pwsh
        run: |
          if (Test-Path OutPut) {
            Remove-Item OutPut -Recurse -Force
          }
          New-Item -ItemType Directory -Path OutPut | Out-Null

      - name: Build .NET 4.0 library
        run: msbuild src/WPFDevelopers.Net40/WPFDevelopers.Net40.csproj /p:Configuration=Release-.NET40 /p:Platform="Any CPU" /p:SignAssembly=false /m

      - name: Upload .NET 4.0 DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpfdevelopers-dlls-net40
          path: OutPut/**/WPFDevelopers.dll
          if-no-files-found: error
