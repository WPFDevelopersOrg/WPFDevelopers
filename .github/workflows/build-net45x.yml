name: Build Net45x

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clean output directory
        shell: pwsh
        run: |
          if (Test-Path OutPut) {
            Remove-Item OutPut -Recurse -Force
          }
          New-Item -ItemType Directory -Path OutPut | Out-Null

      - name: Restore and build target frameworks
        shell: pwsh
        run: |
          [xml]$targetFrameworkConfig = Get-Content src/TargetFrameworks.props
          $frameworks = $targetFrameworkConfig.Project.PropertyGroup.TargetFrameworks.Split(';') | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          $solutionDir = "$(Resolve-Path src)\\"

          Write-Host "Frameworks to build: $($frameworks -join ', ')"

          foreach ($framework in $frameworks) {
            dotnet restore src/WPFDevelopers.Net45x/WPFDevelopers.Net45x.csproj /p:TargetFramework=$framework
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            msbuild src/WPFDevelopers.Net45x/WPFDevelopers.Net45x.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:TargetFramework=$framework /p:SignAssembly=false /p:SolutionDir="$solutionDir" /m
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Rename windows folders to windows7
        shell: pwsh
        run: |
          if (-not (Test-Path OutPut)) {
            exit 0
          }

          Get-ChildItem OutPut -Directory |
            Where-Object { $_.Name -match '^net\d+\.\d+-windows$' } |
            ForEach-Object {
              $source = $_.FullName
              $alias = Join-Path $_.Parent.FullName ($_.Name + '7')

              if (Test-Path $alias) {
                Remove-Item $alias -Recurse -Force
              }

              Move-Item $source $alias
              Write-Host "Renamed folder: $source -> $alias"
            }

      - name: Upload unsigned artifacts
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: wpfdevelopers-net45x-unsigned
          path: |
            OutPut/**/WPFDevelopers.dll
            OutPut/**/en-US/WPFDevelopers.resources.dll
            OutPut/**/ko-KR/WPFDevelopers.resources.dll
          if-no-files-found: error

      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '5553cb31-6326-4371-932c-4dbac4366244'
          project-slug: 'WPFDevelopers'
          signing-policy-slug: 'test-signing'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: '${{ github.workspace }}/signed'

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wpfdevelopers-net45x-signed
          path: '${{ github.workspace }}/signed/**'
