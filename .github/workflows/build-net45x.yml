name: Build Net45x

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      frameworks: ${{ steps.read-frameworks.outputs.frameworks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read target frameworks
        id: read-frameworks
        shell: pwsh
        run: |
          [xml]$props = Get-Content 'src/TargetFrameworks.props'
          $value = ($props.Project.PropertyGroup | Where-Object { $_.TargetFrameworks } | Select-Object -First 1).TargetFrameworks
          $frameworks = @($value -split ';' | Where-Object { $_ -and $_.Trim() })
          $entries = foreach ($framework in $frameworks) {
            $displayName = if ($framework -match '^net\d+\.\d+-windows$') { $framework + '7' } else { $framework }
            [pscustomobject]@{
              name = $displayName
              framework = $framework
            }
          }
          $json = $entries | ConvertTo-Json -Compress -Depth 10
          "frameworks=$json" >> $env:GITHUB_OUTPUT
          Write-Host "Detected frameworks: $json"

  build:
    needs: prepare
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.frameworks) }}

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clean output directory
        shell: pwsh
        run: |
          if (Test-Path OutPut) {
            Remove-Item OutPut -Recurse -Force
          }
          New-Item -ItemType Directory -Path OutPut | Out-Null

      - name: Build target framework
        shell: pwsh
        run: |
          $framework = '${{ matrix.framework }}'
          $solutionDir = "$(Resolve-Path src)\\"

          Write-Host "Building framework: $framework"

          dotnet restore src/WPFDevelopers.Net45x/WPFDevelopers.Net45x.csproj /p:TargetFramework=$framework
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          msbuild src/WPFDevelopers.Net45x/WPFDevelopers.Net45x.csproj /p:Configuration=Release /p:Platform="Any CPU" /p:TargetFramework=$framework /p:SignAssembly=false /p:SolutionDir="$solutionDir" /m
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Rename windows folders to windows7
        shell: pwsh
        run: |
          if (-not (Test-Path OutPut)) {
            exit 0
          }

          Get-ChildItem OutPut -Directory |
            Where-Object { $_.Name -match '^net\d+\.\d+-windows$' } |
            ForEach-Object {
              $source = $_.FullName
              $alias = Join-Path $_.Parent.FullName ($_.Name + '7')

              if (Test-Path $alias) {
                Remove-Item $alias -Recurse -Force
              }

              Move-Item $source $alias
              Write-Host "Renamed folder: $source -> $alias"
            }

      - name: Prepare framework package folder
        shell: pwsh
        run: |
          $framework = '${{ matrix.framework }}'
          $displayName = '${{ matrix.name }}'
          $outputFolder = if ($framework -match '^net\d+\.\d+-windows$') { $framework + '7' } else { $framework }
          $sourceDir = Join-Path '${{ github.workspace }}' "OutPut/$outputFolder"
          $packageRoot = Join-Path '${{ github.workspace }}' 'pack'

          if (Test-Path $packageRoot) {
            Remove-Item $packageRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null

          if (-not (Test-Path (Join-Path $sourceDir 'WPFDevelopers.dll'))) {
            throw "Missing WPFDevelopers.dll in $sourceDir"
          }

          $stagingDir = Join-Path $packageRoot $outputFolder
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          Copy-Item (Join-Path $sourceDir 'WPFDevelopers.dll') (Join-Path $stagingDir 'WPFDevelopers.dll') -Force

          foreach ($culture in @('en-US', 'ko-KR')) {
            $cultureDir = Join-Path $sourceDir $culture
            if (Test-Path $cultureDir) {
              Copy-Item $cultureDir $stagingDir -Recurse -Force
            }
          }

          Write-Host "Prepared package folder: $stagingDir"

      - name: Upload unsigned artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: wpfdevelopers-${{ matrix.name }}-unsigned
          path: '${{ github.workspace }}/pack'
          if-no-files-found: error

      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '5553cb31-6326-4371-932c-4dbac4366244'
          project-slug: 'WPFDevelopers'
          signing-policy-slug: 'test-signing'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: '${{ github.workspace }}/signed'

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wpfdevelopers-${{ matrix.name }}-signed
          path: '${{ github.workspace }}/signed/**'
