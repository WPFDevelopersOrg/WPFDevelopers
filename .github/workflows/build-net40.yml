name: Build Net40

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-net40:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Clean output directory
        shell: pwsh
        run: |
          if (Test-Path OutPut) {
            Remove-Item OutPut -Recurse -Force
          }
          New-Item -ItemType Directory -Path OutPut | Out-Null

      - name: Build .NET 4.0 library
        shell: pwsh
        run: |
          $solutionDir = "$(Resolve-Path src)\\"
          msbuild src/WPFDevelopers.Net40/WPFDevelopers.Net40.csproj /restore /p:Configuration=Release-.NET40 /p:Platform="Any CPU" /p:SignAssembly=false /p:SolutionDir="$solutionDir" /m

      - name: Upload unsigned artifacts
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: wpfdevelopers-net40-unsigned
          path: |
            OutPut/**/WPFDevelopers.dll
            OutPut/**/en-US/WPFDevelopers.resources.dll
            OutPut/**/ko-KR/WPFDevelopers.resources.dll
          if-no-files-found: error

      - name: Submit signing request to SignPath
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '5553cb31-6326-4371-932c-4dbac4366244'
          project-slug: 'WPFDevelopers'
          signing-policy-slug: 'test-signing'
          artifact-configuration-slug: 'default'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: '${{ github.workspace }}/signed'

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wpfdevelopers-net40-signed
          path: '${{ github.workspace }}/signed/**'
