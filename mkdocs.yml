site_name: WPFDevelopers
site_description: WPF controls, themes, and usage guides
site_url: https://wpfdevelopersorg.github.io/WPFDevelopers/
repo_url: https://github.com/WPFDevelopersOrg/WPFDevelopers
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: site

extra_css:
  - assets/stylesheets/wpfdevelopers.css

extra_javascript:
  - assets/javascripts/control-search.js

extra:
  alternate:
    - name: 简体中文
      link: zh/getting-started/
      lang: zh
    - name: English
      link: en/getting-started/
      lang: en

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/wpfdevelopers-logo.png
  favicon: assets/favicon.ico
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

